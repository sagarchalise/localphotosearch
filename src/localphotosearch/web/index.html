<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Photo Search</title>
<style>
  :root {
    --bg: #f6f6f4; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e3e2de;
    --accent: #2f6fe4; --accent-text: #ffffff; --tile: #e9e8e4; --overlay: rgba(12, 12, 10, 0.92);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --panel: #1f1f1d; --text: #ecebe7; --muted: #9b9a94; --line: #2f2f2c;
      --accent: #6b9bff; --accent-text: #0d0d0c; --tile: #262624; --overlay: rgba(0, 0, 0, 0.94);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  button { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button.link { border: none; background: none; color: var(--accent); padding: 0 4px; }

  header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
  .bar { display: flex; gap: 10px; align-items: center; padding: 12px 16px; }
  .search { flex: 1; position: relative; }
  .search input { width: 100%; padding: 10px 14px 10px 38px; font-size: 15px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--panel); color: var(--text); outline: none; }
  .search input:focus { border-color: var(--accent); }
  .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .badge { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; white-space: nowrap; }
  .progress { height: 3px; background: transparent; }
  .progress > div { height: 100%; width: 0; background: var(--accent); transition: width .4s; }
  .status { display: flex; gap: 12px; align-items: center; padding: 0 16px 8px; color: var(--muted); font-size: 12px; min-height: 20px; }
  .status .grow { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  main { padding: 12px 16px 40px; }
  .heading { display: flex; align-items: baseline; gap: 8px; margin: 4px 0 12px; color: var(--muted); }
  .heading strong { color: var(--text); font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 6px; }
  .tile { position: relative; aspect-ratio: 1; background: var(--tile); border-radius: 6px; overflow: hidden;
    cursor: pointer; transition: opacity .2s; }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile.weak { opacity: .4; }
  .tile .score { position: absolute; right: 6px; bottom: 6px; font-size: 11px; padding: 1px 6px; border-radius: 6px;
    background: rgba(0,0,0,.55); color: #fff; opacity: 0; transition: opacity .15s; }
  .tile:hover .score { opacity: 1; }
  .tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tile img { transition: transform .12s, border-radius .12s; }
  .tile .check { position: absolute; left: 6px; top: 6px; width: 24px; height: 24px; border-radius: 50%;
    border: 2px solid #fff; background: rgba(0,0,0,.3); color: #fff; font-size: 13px; line-height: 20px; text-align: center;
    opacity: 0; transition: opacity .15s; cursor: pointer; }
  .tile:hover .check, .grid.selecting .tile .check { opacity: 1; }
  .tile.selected { background: color-mix(in srgb, var(--accent) 25%, var(--tile)); }
  .tile.selected img { transform: scale(.88); border-radius: 4px; }
  .tile.selected .check { background: var(--accent); border-color: var(--accent); opacity: 1; }

  button.danger { background: #c93a3a; border-color: #c93a3a; color: #fff; }
  .selbar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 8; display: flex; gap: 8px;
    align-items: center; padding: 8px 10px 8px 16px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; box-shadow: 0 8px 28px rgba(0,0,0,.28); max-width: calc(100% - 32px); flex-wrap: wrap; }
  .selbar[hidden] { display: none; }
  .selbar .count { font-weight: 600; margin-right: 6px; }
  .toast { position: fixed; left: 50%; bottom: 76px; transform: translateX(-50%); z-index: 30; padding: 8px 14px;
    border-radius: 8px; background: var(--text); color: var(--bg); font-size: 13px; opacity: 0; transition: opacity .2s;
    pointer-events: none; max-width: calc(100% - 32px); }
  .toast.show { opacity: 1; }

  .empty { max-width: 420px; margin: 12vh auto; text-align: center; color: var(--muted); }
  .empty h2 { color: var(--text); font-weight: 600; margin: 0 0 8px; }
  .empty button { margin-top: 16px; }

  aside { position: fixed; top: 0; right: 0; bottom: 0; width: min(380px, 100%); background: var(--panel);
    border-left: 1px solid var(--line); z-index: 10; padding: 16px; transform: translateX(100%); transition: transform .2s;
    display: flex; flex-direction: column; gap: 12px; }
  aside.open { transform: none; }
  aside h3 { margin: 0; font-weight: 600; }
  .folders { list-style: none; margin: 0; padding: 0; overflow: auto; flex: 1; }
  .folders li { display: flex; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .folders li span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
  .stats { color: var(--muted); font-size: 12px; }

  .viewer { position: fixed; inset: 0; background: var(--overlay); z-index: 20; display: none; flex-direction: column; }
  .viewer.open { display: flex; }
  .viewer .img { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; padding: 16px; }
  .viewer img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 4px; }
  .viewer .info { display: flex; gap: 10px; align-items: center; padding: 12px 16px; color: #ddd; flex-wrap: wrap; }
  .viewer .info .meta { flex: 1; min-width: 200px; }
  .viewer .info .meta div:last-child { color: #aaa; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; user-select: text; }
  .viewer button.danger { background: #c93a3a; border-color: #c93a3a; color: #fff; }
  .viewer button { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.18); color: #eee; }
  .viewer .nav { position: absolute; top: 50%; transform: translateY(-50%); font-size: 22px; padding: 8px 14px; }
  .viewer .prev { left: 12px; } .viewer .next { right: 12px; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Describe a photo… e.g. “kids on a beach at sunset”" autocomplete="off" autofocus>
    </div>
    <span class="badge" id="device">loading model…</span>
    <button id="foldersBtn">Folders</button>
  </div>
  <div class="progress"><div id="bar"></div></div>
  <div class="status"><span class="grow" id="status"></span><button class="link" id="cancelBtn" hidden>Cancel</button></div>
</header>

<main>
  <div class="heading" id="heading"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>
    <h2>Pick a folder of photos</h2>
    <div>Photos are indexed on this computer. Nothing leaves your device.</div>
    <button class="primary" id="addFirst">Add folder</button>
  </div>
</main>

<aside id="panel">
  <div style="display:flex;align-items:center;gap:8px"><h3 style="flex:1">Folders</h3><button id="closePanel">Close</button></div>
  <ul class="folders" id="folders"></ul>
  <div class="stats" id="stats"></div>
  <div style="display:flex;gap:8px"><button class="primary" id="addFolder">Add folder</button><button id="rescan">Rescan</button></div>
</aside>

<div class="viewer" id="viewer">
  <div class="img"><img id="vimg" alt=""></div>
  <button class="nav prev" id="vprev" aria-label="Previous">‹</button>
  <button class="nav next" id="vnext" aria-label="Next">›</button>
  <div class="info">
    <div class="meta"><div id="vname"></div><div id="vpath"></div></div>
    <button id="vsimilar">Find similar</button>
    <button id="vopen">Open</button>
    <button id="vreveal">Show in folder</button>
    <button id="vcopy">Copy path</button>
    <button id="vdelete" class="danger" title="Move to Recycle Bin (Delete)">Delete</button>
    <button id="vclose">Close</button>
  </div>
</div>

<div class="selbar" id="selbar" hidden>
  <span class="count" id="selcount"></span>
  <button id="selall">Select all</button>
  <button id="selreveal">Show in folder</button>
  <button id="seldelete" class="danger" title="Move to Recycle Bin (Delete)">Delete</button>
  <button id="selclear" title="Esc">Clear</button>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const DIM_DELTA = 0.10;          // dim results scoring this far below the best match
const api = () => window.pywebview.api;

let view = { mode: "recent", label: "", hits: [] };
let seq = 0, lastState = null, viewerIndex = -1;
let selected = new Set(), lastClicked = -1;

function toast(text) {
  const t = $("toast");
  t.textContent = text;
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove("show"), 3500);
}

function render() {
  const { mode, label, hits } = view;
  const ids = new Set(hits.map((h) => h.id));
  selected = new Set([...selected].filter((id) => ids.has(id)));
  const heading = $("heading");
  if (mode === "search") heading.innerHTML = `<span>Results for</span> <strong></strong>`;
  else if (mode === "similar") heading.innerHTML = `<span>Similar to</span> <strong></strong> <button class="link" id="clearSim">Clear</button>`;
  else heading.innerHTML = hits.length ? `<strong>Recent photos</strong>` : "";
  const strong = heading.querySelector("strong");
  if (strong && mode !== "recent") strong.textContent = label;
  $("clearSim")?.addEventListener("click", () => { $("q").value = ""; showRecent(); });

  const top = hits.length ? hits[0].score : 0;
  const grid = $("grid");
  grid.replaceChildren(...hits.map((h, i) => {
    const tile = document.createElement("div");
    tile.className = "tile" + (mode !== "recent" && h.score < top - DIM_DELTA ? " weak" : "")
      + (selected.has(h.id) ? " selected" : "");
    tile.dataset.id = h.id;
    tile.tabIndex = 0;
    tile.title = h.path;
    const img = document.createElement("img");
    img.loading = "lazy"; img.decoding = "async"; img.src = `thumb/${h.id}.jpg`; img.alt = h.name;
    const check = document.createElement("span");
    check.className = "check"; check.textContent = "✓"; check.title = "Select";
    tile.append(img, check);
    if (mode !== "recent") {
      const s = document.createElement("span"); s.className = "score"; s.textContent = h.score.toFixed(2); tile.append(s);
    }
    tile.addEventListener("click", (e) => {
      const selecting = selected.size > 0 || e.target === check || e.ctrlKey || e.metaKey || e.shiftKey;
      if (!selecting) return openViewer(i);
      if (e.shiftKey && lastClicked >= 0) {
        const [a, b] = [Math.min(lastClicked, i), Math.max(lastClicked, i)];
        for (let k = a; k <= b; k++) selected.add(view.hits[k].id);
      } else {
        selected.has(h.id) ? selected.delete(h.id) : selected.add(h.id);
      }
      lastClicked = i;
      updateSelection();
    });
    tile.addEventListener("keydown", (e) => { if (e.key === "Enter") openViewer(i); });
    return tile;
  }));
  updateSelection();
}

function updateSelection() {
  for (const tile of $("grid").children) tile.classList.toggle("selected", selected.has(Number(tile.dataset.id)));
  $("grid").classList.toggle("selecting", selected.size > 0);
  $("selbar").hidden = selected.size === 0;
  $("selcount").textContent = `${selected.size} selected`;
}

function clearSelection() { selected.clear(); lastClicked = -1; updateSelection(); }

async function deletePhotos(ids) {
  const n = ids.length;
  if (!n || !confirm(`Move ${n === 1 ? "this photo" : `${n} photos`} to the Recycle Bin?\n\nYou can restore ${n === 1 ? "it" : "them"} from the Recycle Bin.`)) return false;
  const { deleted, failed } = await api().delete_photos(ids);
  const gone = new Set(deleted);
  view.hits = view.hits.filter((h) => !gone.has(h.id));
  deleted.forEach((id) => selected.delete(id));
  render();
  const failures = Object.values(failed);
  toast(`Moved ${deleted.length} to the Recycle Bin` + (failures.length ? ` · ${failures.length} failed: ${failures[0]}` : ""));
  return true;
}

$("selall").onclick = () => { view.hits.forEach((h) => selected.add(h.id)); updateSelection(); };
$("selclear").onclick = clearSelection;
$("seldelete").onclick = () => deletePhotos([...selected]);
$("selreveal").onclick = () => { const first = view.hits.find((h) => selected.has(h.id)); if (first) api().reveal_photo(first.id); };

async function showRecent() {
  const my = ++seq;
  const hits = await api().recent(300);
  if (my === seq) { view = { mode: "recent", label: "", hits }; render(); }
}

async function runSearch(text) {
  const my = ++seq;
  const hits = await api().search(text, 120);
  if (my === seq) { view = { mode: "search", label: text, hits }; render(); window.scrollTo(0, 0); }
}

async function runSimilar(hit) {
  const my = ++seq;
  const hits = await api().similar(hit.id, 120);
  if (my === seq) { view = { mode: "similar", label: hit.name, hits: [ { ...hit, score: 1 }, ...hits ] }; render(); window.scrollTo(0, 0); }
}

let debounce;
$("q").addEventListener("input", () => {
  clearTimeout(debounce);
  const text = $("q").value.trim();
  debounce = setTimeout(() => (text ? runSearch(text) : showRecent()), 250);
});

// ---- viewer ---------------------------------------------------------------------------------
function openViewer(i) {
  viewerIndex = i;
  const h = view.hits[i];
  $("vimg").src = `photo/${h.id}`;
  $("vname").textContent = h.name + (h.taken ? ` · ${h.taken}` : "");
  $("vpath").textContent = h.path;
  $("viewer").classList.add("open");
}
function closeViewer() { $("viewer").classList.remove("open"); $("vimg").removeAttribute("src"); viewerIndex = -1; }
function step(d) { if (viewerIndex >= 0) openViewer((viewerIndex + d + view.hits.length) % view.hits.length); }
$("vclose").onclick = closeViewer;
$("vprev").onclick = () => step(-1);
$("vnext").onclick = () => step(1);
$("vopen").onclick = () => api().open_photo(view.hits[viewerIndex].id);
$("vreveal").onclick = () => api().reveal_photo(view.hits[viewerIndex].id);
$("vsimilar").onclick = () => { const h = view.hits[viewerIndex]; closeViewer(); $("q").value = ""; runSimilar(h); };
$("vcopy").onclick = async () => {
  const path = view.hits[viewerIndex].path;
  try { await navigator.clipboard.writeText(path); } catch { await api().copy_text(path); }
  toast("Path copied");
};
async function deleteCurrent() {
  const i = viewerIndex;
  if (!(await deletePhotos([view.hits[i].id]))) return;
  if (!view.hits.length) closeViewer();
  else openViewer(Math.min(i, view.hits.length - 1));
}
$("vdelete").onclick = deleteCurrent;
document.addEventListener("keydown", (e) => {
  const typing = document.activeElement === $("q");
  if ($("viewer").classList.contains("open")) {
    if (e.key === "Escape") closeViewer();
    if (e.key === "ArrowLeft") step(-1);
    if (e.key === "ArrowRight") step(1);
    if (e.key === "Delete") deleteCurrent();
  } else if (e.key === "/" && !typing) { e.preventDefault(); $("q").focus(); }
  else if (e.key === "Delete" && !typing && selected.size) deletePhotos([...selected]);
  else if (e.key === "Escape") { if (selected.size) clearSelection(); else $("panel").classList.remove("open"); }
});

// ---- folders panel --------------------------------------------------------------------------
const togglePanel = (open) => $("panel").classList.toggle("open", open);
$("foldersBtn").onclick = () => togglePanel(true);
$("closePanel").onclick = () => togglePanel(false);
$("addFolder").onclick = $("addFirst").onclick = () => api().add_folder().then(poll);
$("rescan").onclick = () => api().reindex().then(poll);
$("cancelBtn").onclick = () => api().cancel();

function renderFolders(stats) {
  $("folders").replaceChildren(...stats.roots.map((path) => {
    const li = document.createElement("li");
    const span = document.createElement("span"); span.textContent = path; span.title = path;
    const rm = document.createElement("button"); rm.textContent = "Remove";
    rm.onclick = () => { if (confirm(`Remove this folder from the index?\n\n${path}\n\nYour photos are not deleted.`)) api().remove_folder(path).then(() => { showRecent(); poll(); }); };
    li.append(span, rm);
    return li;
  }));
  $("stats").textContent = `${stats.indexed.toLocaleString()} photos indexed` + (stats.failed ? ` · ${stats.failed} could not be read` : "");
}

// ---- status polling -------------------------------------------------------------------------
let pollTimer, lastRecentRefresh = 0;
async function poll() {
  clearTimeout(pollTimer);
  const s = await api().state();
  const prev = lastState;
  lastState = s;
  $("device").textContent = s.status === "loading" ? "loading model…" : s.status === "error" ? "error" : `running on ${s.device}`;

  const indexing = s.status === "indexing" && s.progress;
  const p = s.progress;
  $("bar").style.width = indexing && p.total ? `${(100 * p.done) / p.total}%` : "0";
  $("cancelBtn").hidden = !indexing;
  if (s.error) $("status").textContent = `Error: ${s.error}`;
  else if (s.status === "loading") $("status").textContent = "Loading EmbeddingGemma 2…";
  else if (indexing && p.total) $("status").textContent = `Indexing ${p.done.toLocaleString()} / ${p.total.toLocaleString()} · ${p.rate} photos/s · ${p.current ?? ""}`;
  else if (indexing) $("status").textContent = "Scanning folders…";
  else $("status").textContent = s.stats ? `${s.stats.indexed.toLocaleString()} photos` : "";

  if (s.stats) {
    renderFolders(s.stats);
    const none = s.stats.roots.length === 0;
    $("empty").hidden = !none;
    $("heading").hidden = $("grid").hidden = none;
  }
  // Refresh the browse view as photos arrive; leave active searches alone.
  const countChanged = s.stats && prev?.stats && s.stats.indexed !== prev.stats.indexed;
  const browsing = view.mode === "recent" && !$("q").value.trim();
  const finished = prev && prev.status !== "ready" && s.status === "ready";
  if (browsing && (finished || (countChanged && Date.now() - lastRecentRefresh > 5000))) {
    lastRecentRefresh = Date.now();
    showRecent();
  }
  pollTimer = setTimeout(poll, indexing || s.status === "loading" ? 1000 : 3000);
}

window.addEventListener("pywebviewready", () => { poll(); showRecent(); });
</script>
</body>
</html>
